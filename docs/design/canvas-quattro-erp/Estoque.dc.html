<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estoque · Quattro ERP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Shell" modo="{{modo}}" ativo="estoque" titulo="Estoque" sub="Posição em 13/10/2026" acao="Nova movimentação" acao2="Inventário" hint-size="100%,1000px">
  <div style="{{gk}}">
    <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
      <div style="{{k.estilo}}">
        <span style="font-size: 13px; opacity: 0.85">{{k.rotulo}}</span>
        <dc-import name="Valor" valor="{{k.valor}}" tamanho="var(--erp-numeros)" tom="{{k.tom}}" nivel="{{k.nivel}}" hint-size="200px,30px"></dc-import>
        <span style="font-size: 12px; opacity: 0.8">{{k.nota}}</span>
      </div>
    </sc-for>
  </div>

  <section style="background: var(--erp-cartao); border: var(--erp-borda-espessura) solid var(--erp-borda); border-radius: var(--erp-raio-card); box-shadow: var(--erp-sombra); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <h2 style="margin: 0 auto 0 0; font-size: var(--erp-titulo-secao); font-weight: 500">Produtos</h2>
      <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{f.sel}}" onClick="{{f.ir}}" style="{{f.estilo}}">{{f.rotulo}}</button>
      </sc-for>
    </div>
    <sc-if value="{{desk}}" hint-placeholder-val="{{true}}">
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px">
          <thead><tr><sc-for list="{{cols}}" as="c" hint-placeholder-count="7"><th style="{{c.estilo}}">{{c.r}}</th></sc-for></tr></thead>
          <tbody>
            <sc-for list="{{linhas}}" as="l" hint-placeholder-count="8">
              <tr><sc-for list="{{l.celulas}}" as="c" hint-placeholder-count="7"><td style="{{c.estilo}}"><sc-if value="{{c.badge}}" hint-placeholder-val="{{false}}"><span style="{{c.etq}}">{{c.texto}}</span></sc-if><sc-if value="{{c.dinheiro}}" hint-placeholder-val="{{false}}"><dc-import name="Valor" valor="{{c.texto}}" tamanho="14px" alinhar="direita" hint-size="100%,14px"></dc-import></sc-if><sc-if value="{{c.simples}}" hint-placeholder-val="{{true}}">{{c.texto}}</sc-if></td></sc-for></tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </sc-if>
    <sc-if value="{{mob}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{linhas}}" as="l" hint-placeholder-count="8">
          <div style="border: var(--erp-borda-espessura) solid var(--erp-borda); border-radius: calc(var(--erp-raio-card) * 0.6); padding: 14px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 15px; font-weight: 500; flex: 1; min-width: 0">{{l.titulo}}</span>
              <span style="{{l.etq}}">{{l.status}}</span>
            </div>
            <sc-for list="{{l.pares}}" as="p" hint-placeholder-count="4">
              <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px"><span style="color: var(--erp-texto-2)">{{p.r}}</span><sc-if value="{{p.dinheiro}}" hint-placeholder-val="{{false}}"><dc-import name="Valor" valor="{{p.v}}" tamanho="15px" alinhar="direita" hint-size="110px,15px"></dc-import></sc-if><sc-if value="{{p.simples}}" hint-placeholder-val="{{true}}"><span style="font-weight: 500; text-align: right">{{p.v}}</span></sc-if></div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </section>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modo":{"editor":"enum","default":"desktop","options":["desktop","mobile"]},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const modo = this.props.modo ?? 'desktop';
    const mob = modo === 'mobile';
    const filtroAtual = (this.state && this.state.filtro) || 'Todos';
    const etq = (tom) => {
      const m = { sucesso: ['--erp-sucesso-fundo', '--erp-sucesso'], alerta: ['--erp-alerta-fundo', '--erp-alerta'], perigo: ['--erp-perigo-fundo', '--erp-perigo'], neutro: ['--erp-cartao-2', '--erp-texto-2'] }[tom];
      return 'display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--erp-raio-etiqueta);white-space:nowrap;background:var(' + m[0] + ');color:var(' + m[1] + ');';
    };
    const cardK = (destaque) => (destaque ? 'background:var(--erp-destaque);color:var(--erp-cartao);' : 'background:var(--erp-cartao);color:var(--erp-texto);border:var(--erp-borda-espessura) solid var(--erp-borda);') +
      'border-radius:var(--erp-raio-card);box-shadow:var(--erp-sombra);padding:20px;display:flex;flex-direction:column;gap:10px;';
    const kpis = [
      ['Valor em estoque', 'R$412.880,40', 'pelo custo médio', true],
      ['Itens cadastrados', '1.284', 'em 3 depósitos'],
      ['Abaixo do mínimo', '23', 'reposição sugerida: R$38.400,00'],
      ['Giro médio', '38 dias', 'últimos 90 dias']
    ].map(([rotulo, valor, nota, d]) => ({ rotulo, valor, nota, tom: d ? 'claro' : 'padrao', nivel: d ? 'principal' : 'padrao', estilo: cardK(!!d) }));
    const filtros = ['Todos', 'Abaixo do mínimo', 'Sem giro', 'Matriz'].map((rotulo) => ({
      rotulo, sel: rotulo === filtroAtual ? 'true' : 'false', ir: () => this.setState({ filtro: rotulo }),
      estilo: 'height:' + (mob ? 44 : 36) + 'px;padding:0 14px;border-radius:999px;cursor:pointer;font-family:var(--erp-fonte-texto);font-size:13px;' +
        (rotulo === filtroAtual ? 'border:0;background:var(--erp-destaque);color:var(--erp-cartao);font-weight:500;' : 'border:var(--erp-borda-espessura) solid var(--erp-borda);background:transparent;color:var(--erp-texto-2);')
    }));
    const defs = [['Produto', 'l', 'titulo'], ['SKU', 'l'], ['Depósito', 'l'], ['Saldo', 'r'], ['Mínimo', 'r'], ['Custo médio', 'r'], ['Situação', 'l', 'badge']];
    const dados = [
      ['Cimento CP II 50 kg', 'CIM-050', 'Matriz · Curitiba', '12 un.', '80 un.', 'R$34,90', 'Crítico', 'perigo'],
      ['Tubo PVC 100 mm 6 m', 'PVC-100', 'Matriz · Curitiba', '8 un.', '40 un.', 'R$62,40', 'Crítico', 'perigo'],
      ['Argamassa AC-II 20 kg', 'ARG-020', 'Filial · São José', '34 un.', '60 un.', 'R$18,70', 'Baixo', 'alerta'],
      ['Tinta acrílica branca 18 L', 'TIN-018', 'Matriz · Curitiba', '19 un.', '25 un.', 'R$289,00', 'Baixo', 'alerta'],
      ['Porcelanato 60x60 Bege', 'POR-606', 'CD · Araucária', '412 m²', '150 m²', 'R$54,30', 'Normal', 'sucesso'],
      ['Telha fibrocimento 2,44 m', 'TEL-244', 'CD · Araucária', '236 un.', '80 un.', 'R$41,80', 'Normal', 'sucesso'],
      ['Vergalhão CA-50 10 mm', 'VER-010', 'Matriz · Curitiba', '1.240 kg', '500 kg', 'R$7,95', 'Normal', 'sucesso'],
      ['Massa corrida 25 kg', 'MAS-025', 'Filial · São José', '0 un.', '20 un.', 'R$46,50', 'Sem saldo', 'perigo']
    ];
    const cols = defs.map(([r, al]) => ({ r, estilo: 'text-align:' + (al === 'r' ? 'right' : 'left') + ';font-size:11px;font-weight:500;letter-spacing:0.44px;text-transform:uppercase;color:var(--erp-texto-2);padding:0 8px 10px 0;' }));
    const linhas = dados.map((d) => {
      const status = d[6]; const tom = d[7];
      const celulas = defs.map(([r, al, papel], i) => ({
        texto: d[i], badge: papel === 'badge', dinheiro: al === 'r', simples: papel !== 'badge' && al !== 'r', etq: etq(tom),
        estilo: 'padding:12px 8px 12px 0;border-top:var(--erp-borda-espessura) solid var(--erp-borda);text-align:' + (al === 'r' ? 'right' : 'left') + ';' + (papel === 'titulo' ? '' : 'color:var(--erp-texto-2);') + (al === 'r' ? 'color:var(--erp-texto);font-weight:500;' : '')
      }));
      const pares = defs.map(([r, al, papel], i) => ({ r, v: d[i], papel, al })).filter((p) => !p.papel).map(({ r, v, al }) => ({ r, v, dinheiro: al === 'r', simples: al !== 'r' }));
      return { celulas, titulo: d[0], status, etq: etq(tom), pares };
    });
    return {
      modo, desk: !mob, mob, kpis, filtros, cols, linhas,
      gk: mob ? 'display:grid;grid-template-columns:minmax(0,1fr);gap:12px;' : 'display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;'
    };
  }
}
</script>
</body>
</html>
