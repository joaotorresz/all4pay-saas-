<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Main" modo="vars" hint-size="0px,0px"></dc-import>
<div style="width: 1280px; height: 1320px; box-sizing: border-box; padding: 48px; background: var(--erp-fundo); color: var(--erp-texto); font-family: var(--erp-fonte-texto); display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: var(--erp-fonte-titulo); font-weight: var(--erp-peso-titulo); font-size: var(--erp-titulo-pagina); text-transform: var(--erp-titulo-caixa); letter-spacing: var(--erp-titulo-espacamento, 0em); line-height: 1.05">Ícones do sistema</h1>
    <p style="margin: 0; color: var(--erp-texto-2); max-width: 760px; line-height: 1.5">61 ícones duotônicos, desenhados a partir da ilustração da marca: volume na cor do texto, contorno 1,7 e um acento lime. Os controles (setas, X, mais, menos) ficam só no traço. O nome embaixo é a chave usada no código.</p>
  </div>
  <sc-for list="{{grupos}}" as="g" hint-placeholder-count="2">
    <section style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: var(--erp-titulo-secao); font-weight: 500">{{g.nome}} · {{g.qtd}}</span>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{g.itens}}" as="i" hint-placeholder-count="10">
          <div style="background: var(--erp-cartao); border-radius: 14px; padding: 16px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px">
            <img src="{{i.url}}" alt="{{i.nome}}" style="width: 40px; height: 40px">
            <span style="font-size: 11px; color: var(--erp-texto-2); text-align: center; word-break: break-all">{{i.nome}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
