<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moldura · Quattro ERP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Main" modo="vars" hint-size="0px,0px"></dc-import>

<sc-if value="{{desk}}" hint-placeholder-val="{{true}}">
<div style="box-sizing: border-box; min-height: 820px; background: var(--erp-fundo); color: var(--erp-texto); font-family: var(--erp-fonte-texto); font-size: var(--erp-tamanho-base); padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; font-variant-numeric: tabular-nums">
  <nav aria-label="Menu principal" style="flex: 0 0 var(--erp-menu-largura); background: var(--erp-menu-fundo); color: var(--erp-menu-texto); border: var(--erp-borda-espessura) solid var(--erp-menu-borda); border-radius: var(--erp-raio-card); box-shadow: var(--erp-sombra); padding: 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; min-height: 788px">
    <a href="Dashboard.dc.html" style="display: block; padding: 4px 10px 18px; text-decoration: none">
      <img src="/_blob/5b36001448cc33b517b195af432ecb60" alt="Quattro" style="display: var(--erp-logo-original); width: var(--erp-logo-largura); height: auto">
      <span role="img" aria-label="Quattro" class="erp-logo-mono" style="display: var(--erp-logo-mono); width: var(--erp-logo-largura); aspect-ratio: 2000 / 546; background: var(--erp-logo-cor)"></span>
    </a>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="9">
      <sc-if value="{{m.linha}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="display: block; height: 1px; margin: 0 12px; background: var(--erp-menu-borda); opacity: 0.6"></span></sc-if>
      <a href="{{m.href}}" aria-current="{{m.atual}}" style="{{m.estilo}}">
        <sc-if value="{{m.temImg}}" hint-placeholder-val="{{false}}"><img src="/_blob/72acc6a74acd6ab55ebf3c8e0d49c455" alt="" style="width: 28px; height: 28px; object-fit: contain; flex: none; margin: -5px"></sc-if>
        <sc-if value="{{m.temSvg}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.icone}}"></path></svg></sc-if>
        <span>{{m.rotulo}}</span>
      </a>
    </sc-for>
    <div style="margin-top: auto; padding-top: 14px; border-top: var(--erp-borda-espessura) solid var(--erp-menu-borda); display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: var(--erp-destaque); color: var(--erp-cartao); display: grid; place-items: center; font-size: 13px; font-weight: 500; flex: none">CA</span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Comercial Andrade Ltda</span>
        <span style="font-size: 12px; color: var(--erp-texto-2)">12.345.678/0001-90</span>
      </span>
    </div>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--erp-cartao); border: var(--erp-borda-espessura) solid var(--erp-borda); border-radius: var(--erp-raio-card); box-shadow: var(--erp-sombra); padding: 10px 12px 10px 20px">
      <label style="flex: 1 1 260px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: var(--erp-borda-espessura) solid var(--erp-borda); border-radius: 14px; background: var(--erp-cartao-2); color: var(--erp-texto-2); max-width: 420px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</span>
        <input type="search" placeholder="Buscar cliente, nota, produto…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: var(--erp-fonte-texto); font-size: 14px; color: var(--erp-texto)">
      </label>
      <span style="margin-left: auto; font-size: 13px; color: var(--erp-texto-2)">13/10/2026</span>
      <button type="button" aria-label="Notificações" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--erp-texto); display: grid; place-items: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 999px; background: var(--erp-perigo)"></span>
      </button>
      <span style="width: 40px; height: 40px; border-radius: 999px; background: var(--erp-cartao-2); border: var(--erp-borda-espessura) solid var(--erp-borda); display: grid; place-items: center; font-size: 13px; font-weight: 500">MA</span>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; padding: 4px 4px 0">
      <div style="display: flex; flex-direction: column; gap: 6px; margin-right: auto">
        <h1 style="margin: 0; font-family: var(--erp-fonte-titulo); font-weight: var(--erp-peso-titulo); font-size: var(--erp-titulo-pagina); text-transform: var(--erp-titulo-caixa); letter-spacing: var(--erp-titulo-espacamento, 0em); line-height: 1.05">{{titulo}}</h1>
      </div>
      <sc-if value="{{temAcao2}}" hint-placeholder-val="{{false}}">
        <button type="button" style="height: var(--erp-botao-altura); padding: 0 var(--erp-botao-padding); min-width: var(--erp-botao-min); border-radius: var(--erp-botao-raio); border: var(--erp-borda-espessura) solid var(--erp-controle-borda); background: transparent; color: var(--erp-texto); font-family: var(--erp-fonte-texto); font-size: var(--erp-tamanho-base); font-weight: 500; cursor: pointer">{{acao2}}</button>
      </sc-if>
      <sc-if value="{{temAcao}}" hint-placeholder-val="{{true}}">
        <button type="button" style="height: var(--erp-botao-altura); padding: 0 var(--erp-botao-padding); min-width: var(--erp-botao-min); border-radius: var(--erp-botao-raio); border: 0; background: var(--erp-primaria); color: var(--erp-sobre-primaria); font-family: var(--erp-fonte-texto); font-size: var(--erp-tamanho-base); font-weight: 500; cursor: pointer">{{acao}}</button>
      </sc-if>
    </div>

    {{children}}
  </div>
</div>
</sc-if>

<sc-if value="{{mob}}" hint-placeholder-val="{{false}}">
<div style="width: 390px; box-sizing: border-box; min-height: 844px; background: var(--erp-fundo); color: var(--erp-texto); font-family: var(--erp-fonte-texto); font-size: var(--erp-tamanho-base); display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 12px 18px; background: var(--erp-menu-fundo); color: var(--erp-menu-texto); border-bottom: var(--erp-borda-espessura) solid var(--erp-menu-borda)">
    <img src="/_blob/5b36001448cc33b517b195af432ecb60" alt="Quattro" style="display: var(--erp-logo-original); width: calc(var(--erp-logo-largura) * 0.8); height: auto">
    <span role="img" aria-label="Quattro" class="erp-logo-mono" style="display: var(--erp-logo-mono); width: calc(var(--erp-logo-largura) * 0.8); aspect-ratio: 2000 / 546; background: var(--erp-logo-cor)"></span>
    <button type="button" aria-label="Buscar" style="margin-left: auto; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: grid; place-items: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </button>
    <button type="button" aria-label="Notificações" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: grid; place-items: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 999px; background: var(--erp-perigo)"></span>
    </button>
  </header>

  <div style="padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: var(--erp-fonte-titulo); font-weight: var(--erp-peso-titulo); font-size: calc(var(--erp-titulo-pagina) * 0.8); text-transform: var(--erp-titulo-caixa); letter-spacing: var(--erp-titulo-espacamento, 0em); line-height: 1.05">{{titulo}}</h1>
  </div>
  <sc-if value="{{temAcao}}" hint-placeholder-val="{{true}}">
    <div style="padding: 8px 16px 4px">
      <button type="button" style="width: 100%; height: max(44px, var(--erp-botao-altura)); padding: 0 var(--erp-botao-padding); border-radius: var(--erp-botao-raio); border: 0; background: var(--erp-primaria); color: var(--erp-sobre-primaria); font-family: var(--erp-fonte-texto); font-size: 16px; font-weight: 500">{{acao}}</button>
    </div>
  </sc-if>

  <div style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; flex: 1">
    {{children}}
  </div>

  <nav aria-label="Navegação principal" style="position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--erp-menu-fundo); border-top: var(--erp-borda-espessura) solid var(--erp-menu-borda); padding: 6px 4px 10px">
    <sc-for list="{{abas}}" as="a" hint-placeholder-count="5">
      <a href="{{a.href}}" aria-current="{{a.atual}}" style="{{a.estilo}}">
        <span style="{{a.pilula}}">
          <sc-if value="{{a.temImg}}" hint-placeholder-val="{{false}}"><img src="/_blob/72acc6a74acd6ab55ebf3c8e0d49c455" alt="" style="width: 30px; height: 30px; object-fit: contain"></sc-if>
          <sc-if value="{{a.temSvg}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icone}}"></path></svg></sc-if>
        </span>
        <span>{{a.rotulo}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"titulo":{"editor":null,"default":"Dashboard"},"sub":{"editor":null,"default":"Visão geral"},"ativo":{"editor":null,"default":"dashboard"},"modo":{"editor":null,"default":"desktop"},"acao":{"editor":null,"default":"Novo lançamento"},"acao2":{"editor":null,"default":""},"children":{"editor":null},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const modo = this.props.modo ?? 'desktop';
    const mob = modo === 'mobile';
    const ativo = this.props.ativo ?? 'dashboard';
    const I = {
      dashboard: 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z',
      financeiro: 'M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2',
      estoque: 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
      vendas: 'M6 6h15l-2 9H8zM6 6 5 3H2M9 20h.01M18 20h.01',
      compras: 'M4 7h16v13H4zM8 7V5a4 4 0 0 1 8 0v2',
      fiscal: 'M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3',
      cadastros: 'M16 19a4 4 0 0 0-8 0M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 19a3 3 0 0 0-3-3M4 19a3 3 0 0 1 3-3',
      relatorios: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      configuracoes: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1',
      mais: 'M5 12h.01M12 12h.01M19 12h.01'
    };
    const telas = [
      ['dashboard', 'Dashboard', 'Dashboard'], ['financeiro', 'Financeiro', 'Financeiro'], ['estoque', 'Estoque', 'Estoque'],
      ['vendas', 'Pedidos e vendas', 'Vendas'], ['compras', 'Compras', 'Compras'], ['fiscal', 'Fiscal (NF-e)', 'Fiscal'],
      ['cadastros', 'Cadastros', 'Cadastros'], ['relatorios', 'Relatórios', 'Relatorios'], ['configuracoes', 'Configurações', 'Configuracoes']
    ];
    const menu = telas.map(([k, rotulo, arq], i) => {
      const atual = k === ativo;
      return {
        linha: i > 0, temImg: k === 'dashboard', temSvg: k !== 'dashboard',
        rotulo, icone: I[k], href: arq + '.dc.html', atual: atual ? 'page' : 'false',
        estilo: 'display:flex;align-items:center;gap:var(--erp-menu-icone-espaco, 10px);min-height:44px;padding:0 12px;border-radius:12px;text-decoration:none;font-size:14px;color:var(--erp-menu-texto);' +
          (atual ? 'background:var(--erp-menu-ativo);color:var(--erp-sobre-primaria);font-weight:500;' : '')
      };
    });
    const principais = ['dashboard', 'financeiro', 'vendas', 'estoque'];
    const abaAtiva = principais.includes(ativo) ? ativo : 'mais';
    const abas = [
      ['dashboard', 'Início', 'DashboardMobile'], ['financeiro', 'Financeiro', 'FinanceiroMobile'], ['vendas', 'Vendas', 'VendasMobile'],
      ['estoque', 'Estoque', 'EstoqueMobile'], ['mais', 'Mais', 'ConfiguracoesMobile']
    ].map(([k, rotulo, arq]) => {
      const atual = k === abaAtiva;
      return {
        temImg: k === 'dashboard', temSvg: k !== 'dashboard',
        rotulo, icone: I[k], href: arq + '.dc.html', atual: atual ? 'page' : 'false',
        estilo: 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--erp-aba-icone-espaco, 2px);min-height:52px;text-decoration:none;font-size:11px;color:' + (atual ? 'var(--erp-menu-texto)' : 'var(--erp-texto-2)') + ';' + (atual ? 'font-weight:500;' : ''),
        pilula: 'display:grid;place-items:center;width:52px;height:30px;border-radius:999px;' + (atual ? 'background:var(--erp-menu-ativo);color:var(--erp-sobre-primaria);' : '')
      };
    });
    const acao = this.props.acao ?? '';
    const acao2 = this.props.acao2 ?? '';
    return {
      desk: !mob, mob,
      titulo: this.props.titulo ?? 'Dashboard',
      sub: this.props.sub ?? '',
      acao, acao2, temAcao: !!acao, temAcao2: !!acao2 && !mob,
      children: this.props.children ?? null,
      menu, abas
    };
  }
}
</script>
</body>
</html>
