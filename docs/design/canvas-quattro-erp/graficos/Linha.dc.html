ot;:&quot;Grade&quot;},&quot;corGrade&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e2e2e2&quot;,&quot;section&quot;:&quot;Grade&quot;},&quot;gradeTracejada&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Grade&quot;},&quot;espessuraPonto&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0.5, &quot;max&quot;: 5, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Pontos&quot;},&quot;bordaSelecionado&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0, &quot;max&quot;: 5, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Interação&quot;},&quot;cardPosicao&quot;: {&quot;editor&quot;: &quot;select&quot;, &quot;default&quot;: &quot;Acima&quot;, &quot;options&quot;: [&quot;Acima&quot;, &quot;Abaixo&quot;, &quot;Direita&quot;, &quot;Esquerda&quot;], &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardDistancia&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 14, &quot;min&quot;: 4, &quot;max&quot;: 48, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardOrdem&quot;: {&quot;editor&quot;: &quot;select&quot;, &quot;default&quot;: &quot;Mês · Valor · Variação&quot;, &quot;options&quot;: [&quot;Mês · Valor · Variação&quot;, &quot;Valor · Mês · Variação&quot;, &quot;Valor · Variação · Mês&quot;, &quot;Variação · Valor · Mês&quot;], &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardLayout&quot;: {&quot;editor&quot;: &quot;select&quot;, &quot;default&quot;: &quot;Empilhado&quot;, &quot;options&quot;: [&quot;Empilhado&quot;, &quot;Em linha&quot;], &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardAlinhamento&quot;: {&quot;editor&quot;: &quot;select&quot;, &quot;default&quot;: &quot;Esquerda&quot;, &quot;options&quot;: [&quot;Esquerda&quot;, &quot;Centro&quot;, &quot;Direita&quot;], &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardEspaco&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 4, &quot;min&quot;: 0, &quot;max&quot;: 16, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardPaddingV&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 10, &quot;min&quot;: 4, &quot;max&quot;: 24, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardPaddingH&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 12, &quot;min&quot;: 4, &quot;max&quot;: 28, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardRaio&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 12, &quot;min&quot;: 0, &quot;max&quot;: 24, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardFundo&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ffffff&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardTamanhoValor&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 16, &quot;min&quot;: 12, &quot;max&quot;: 28, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;cardTamanhoMes&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 12, &quot;min&quot;: 10, &quot;max&quot;: 16, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Card da seleção&quot;},&quot;pillVariacao&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Variação&quot;},&quot;corPorSinal&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Variação&quot;},&quot;testarVariacao&quot;: {&quot;editor&quot;: &quot;select&quot;, &quot;default&quot;: &quot;Real&quot;, &quot;options&quot;: [&quot;Real&quot;, &quot;Positiva&quot;, &quot;Negativa&quot;], &quot;section&quot;: &quot;Variação&quot;},&quot;corPositiva&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#35C759&quot;, &quot;section&quot;: &quot;Variação&quot;},&quot;corNegativa&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#E5484D&quot;, &quot;section&quot;: &quot;Variação&quot;},&quot;opacidadePill&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.14, &quot;min&quot;: 0, &quot;max&quot;: 1, &quot;step&quot;: 0.02, &quot;section&quot;: &quot;Variação&quot;},&quot;mostrarLegendaVariacao&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Variação&quot;},&quot;tamanhoMeses&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 13, &quot;min&quot;: 10, &quot;max&quot;: 18, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Eixo&quot;},&quot;pillProporcional&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Variação&quot;},&quot;proporcaoPill&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.75, &quot;min&quot;: 0.5, &quot;max&quot;: 1, &quot;step&quot;: 0.05, &quot;section&quot;: &quot;Variação&quot;},&quot;fraseNaPill&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;section&quot;: &quot;Variação&quot;},&quot;distanciaFrase&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 10, &quot;min&quot;: 0, &quot;max&quot;: 30, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Variação&quot;},&quot;espacoValorPill&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 4, &quot;min&quot;: -4, &quot;max&quot;: 24, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;section&quot;: &quot;Variação&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:680}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const W = 1100, altura = p.altura ?? 360, topo = 20, base = altura - 20;

      if (!suave) return pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');

        const mx = (x0 + x1) / 2;

      }
      return d;
    };
    const caminho = traca(valores);
    const passo = W / (valores.length - 1);
    const mesSel = p.mesSelecionado ?? 'Set';
    const iSel = nomes.indexOf(mesSel);
    let sel = { x: 0, y: 0, left: 0, topo: 0, mes: '', valor: '', variacao: '' };
    if (iSel >= 0) {
      const v = valores[iSel], ant = iSel > 0 ? valores[iSel - 1] : v;
      const varPct = ((v - ant) / ant) * 100;
      sel = {
        x: x(iSel).toFixed(1), y: y(v).toFixed(1), left: (x(iSel) / W) * 100, topo: y(v) - 14,
        mes: mesSel, valor: 'R$' + v + ' mil',
        variacao: (varPct >= 0 ? '+' : '−') + Math.abs(varPct).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%',

    const al = { 'Esquerda': ['flex-start', 'left'], 'Centro': ['center', 'center'], 'Direita': ['flex-end', 'right'] }[p.cardAlinhamento ?? 'Esquerda'] || ['flex-start', 'left'];
    const emLinha = (p.cardLayout ?? 'Empilhado') === 'Em linha';
    const transf = { 'Acima': 'translate(-50%, calc(-100% - ' + dist + 'px))', 'Abaixo': 'translate(-50%, ' + dist + 'px)', 'Direita': 'translate(' + dist + 'px, -50%)', 'Esquerda': 'translate(calc(-100% - ' + dist + 'px), -50%)' }[pos];
    if (iSel >= 0) sel.topo = y(v0);
    const card = {
      transform: transf, fundo: p.cardFundo ?? '#ffffff', raio: p.cardRaio ?? 12,
      pv: p.cardPaddingV ?? 10, ph: p.cardPaddingH ?? 12, gap: p.cardEspaco ?? 4,
      direcao: emLinha ? 'row' : 'column', alinhar: emLinha ? 'center' : al[0], texto: al[1],
      oMes, oValor, oVar, tamValor: p.cardTamanhoValor ?? 16, tamRotulo: p.cardTamanhoMes ?? 12,
      variacao: txtVar, legenda: p.mostrarLegendaVariacao ?? true,
      pillPv: usaPill ? 2 : 0, pillPh: usaPill ? 8 : 0,
      pillPad: usaPill ? '0.35em 0.7em' : '0',
      pillFonte: (p.pillProporcional ?? true) ? Math.round((p.cardTamanhoValor ?? 16) * (p.proporcaoPill ?? 0.75)) : 12,
      espacoValorPill: p.espacoValorPill ?? 4,
      textoDentro: ((p.mostrarLegendaVariacao ?? true) && (p.fraseNaPill ?? false)) ? 'sobre o mês anterior' : '',
      gapDentro: ((p.mostrarLegendaVariacao ?? true) && (p.fraseNaPill ?? false)) ? (p.distanciaFrase ?? 10) : 0,
      textoFora: ((p.mostrarLegendaVariacao ?? true) && !(p.fraseNaPill ?? false)) ? 'sobre o mês anterior' : '',
      gapFrase: ((p.mostrarLegendaVariacao ?? true) && !(p.fraseNaPill ?? false)) ? (p.distanciaFrase ?? 10) : 0,
      pillFundo: usaPill ? (porSinal ? 'color-mix(in srgb, ' + corSinal + ' ' + opPill + '%, transparent)' : '#f6f6f6') : 'transparent',
      pillTexto: porSinal ? corSinal : '#3B4332',
    };
    return {
      caminho,
      caminhoArea: caminho + ' L' + W + ' ' + base + ' L0 ' + base + ' Z',
      caminhoComp: traca(anteriores),
      pts: valores.map((v, i) => ({ x: x(i).toFixed(1), y: y(v).toFixed(1), hx: (x(i) - passo / 2).toFixed(1), hw: passo.toFixed(1) })),
      grade: [0.25, 0.5, 0.75, 1].map((f) => ({ y: (topo + (base - topo) * f).toFixed(1) })),
      meses: nomes.map((m) => ({ nome: m, peso: m === mesSel ? 500 : 400, cor: m === mesSel ? '#3B4332' : '#6B7060' })),
      altura, base, card,
      espessuraPonto: p.espessuraPonto ?? 2, bordaSelecionado: p.bordaSelecionado ?? 2, tamanhoMeses: p.tamanhoMeses ?? 13,
      cor: p.cor ?? '#3B4332',
      espessura: p.espessura ?? 1.6,
      raioPonto: p.raioPonto ?? 4,
      opacidadePontos: (p.pontos ?? false) ? 1 : 0,
      area: p.area ?? true,
      corArea: p.corArea ?? '#ECFD52',
      opacidadeArea: p.opacidadeArea ?? 0.5,
      opacidadeFim: p.opacidadeBase ?? 0,
      preenchimentoArea: (p.gradienteArea ?? true) ? 'url(#a4p-area-degrade)' : (p.corArea ?? '#ECFD52'),
      opacidadePath: (p.gradienteArea ?? true) ? 1 : (p.opacidadeArea ?? 0.5),
      comparar: p.comparar ?? true,
      corComparacao: p.corComparacao ?? '#B5B594',
      espessuraComparacao: p.espessuraComparacao ?? 1.4,
      tracoComparacao: traco > 0 ? traco + ' ' + traco : '0',
      corHover: p.corHover ?? '#6B7060',
      temSel: iSel >= 0, sel,
      corSelecao: p.corSelecao ?? '#B5B594',
      espessuraGuia: p.espessuraGuia ?? 1,
      corPontoSelecionado: p.corPontoSelecionado ?? '#3B4332',
      raioSelecionado: p.raioSelecionado ?? 6,
      mostrarGrade: p.mostrarGrade ?? true, corGrade: p.corGrade ?? '#e2e2e2',
      tracoGrade: (p.gradeTracejada ?? true) ? '3 4' : '0',
    };
  }
}
</script>
