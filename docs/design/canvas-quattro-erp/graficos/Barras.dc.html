<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barras · Quattro ERP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: Roobert; src: url("/_blob/9f45d3fc9b401434c55da31af89c636e") format("opentype"); font-weight: 100 440; font-style: normal; font-display: swap; }
@font-face { font-family: Roobert; src: url("/_blob/0dbe723517e6d3cad136f101b60123dd") format("opentype"); font-weight: 450 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Centra No2"; src: url("/_blob/517919385a831578a4774030d0be82d0") format("truetype"); font-weight: 100 900; font-style: normal; font-display: swap; }
body{margin:0}
*{box-sizing:border-box}
</style>
</helmet>
<div style="width: 1280px; height: 720px; background: #ffffff; padding: 48px; font-family: Roobert, -apple-system, sans-serif; color: #3B4332; display: flex; flex-direction: column; gap: 24px">
  <h1 style="margin: 0; font-family: 'Centra No2', Roobert, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; letter-spacing: 0">Barras</h1>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; flex: 1">
    <div style="background: #f6f6f6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Entradas × saídas por mês</h2>
        <div style="display: flex; gap: 14px; font-size: 12px; color: #6B7060">
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{corEntrada}}"></span>Entradas</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{corSaida}}"></span>Saídas</span>
        </div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: {{espaco}}px; height: 360px; border-bottom: 1px solid #e2e2e2; padding: 0 4px">
        <sc-for list="{{agrupadas}}" as="b" hint-placeholder-count="6">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end">
            <div style="display: flex; align-items: flex-end; gap: 4px; height: 100%; width: 100%; justify-content: center">
              <div style="width: 40%; height: {{b.he}}%; background: {{corEntrada}}; border-radius: {{raio}}px {{raio}}px 0 0"></div>
              <div style="width: 40%; height: {{b.hs}}%; background: {{corSaida}}; border-radius: {{raio}}px {{raio}}px 0 0"></div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: {{espaco}}px; padding: 0 4px; font-size: 11px; color: #6B7060">
        <sc-for list="{{agrupadas}}" as="b" hint-placeholder-count="6"><span style="flex: 1; text-align: center">{{b.mes}}</span></sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px">
      <div style="background: #f6f6f6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; flex: 1">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Gastos por categoria</h2>
        <sc-for list="{{horizontais}}" as="h" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; font-size: 13px">
              <span>{{h.nome}}</span>
              <span style="font-weight: 500; color: #000000; font-variant-numeric: tabular-nums">{{h.valor}}</span>
            </div>
            <div style="height: 10px; background: #ffffff; border-radius: 999px; overflow: hidden">
              <div style="height: 100%; width: {{h.pct}}%; background: {{corHorizontal}}; border-radius: 999px"></div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="background: #f6f6f6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Composição (empilhada)</h2>
        <div style="display: flex; height: 28px; border-radius: {{raio}}px; overflow: hidden">
          <sc-for list="{{pilha}}" as="s" hint-placeholder-count="4"><div style="width: {{s.pct}}%; background: {{s.cor}}"></div></sc-for>
        </div>
        <div style="display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #6B7060">
          <sc-for list="{{pilha}}" as="s" hint-placeholder-count="4">
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{s.cor}}"></span>{{s.nome}} · {{s.pct}}%</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"corEntrada":{"editor":"color","default":"#3B4332","section":"Cores"},"corSaida":{"editor":"color","default":"#B5B594","section":"Cores"},"corHorizontal":{"editor":"color","default":"#3B4332","section":"Cores"},"raio":{"editor":"range","default":6,"min":0,"max":16,"step":1,"unit":"px","section":"Forma"},"espaco":{"editor":"range","default":18,"min":4,"max":40,"step":1,"unit":"px","section":"Forma"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dados = [['Mai', 82, 64], ['Jun', 90, 70], ['Jul', 76, 81], ['Ago', 98, 72], ['Set', 104, 88], ['Out', 112, 79]];
    const max = 120;
    const cats = [['Folha', 42000], ['Fornecedores', 31500], ['Impostos', 18200], ['Aluguel', 9800], ['Marketing', 6400]];
    const top = cats[0][1];
    const fmt = (v) => 'R$' + v.toLocaleString('pt-BR');
    return {
      agrupadas: dados.map(([mes, e, s]) => ({ mes, he: Math.round((e / max) * 100), hs: Math.round((s / max) * 100) })),
      horizontais: cats.map(([nome, v]) => ({ nome, valor: fmt(v), pct: Math.round((v / top) * 100) })),
      pilha: [
        { nome: 'Serviços', pct: 46, cor: '#3B4332' },
        { nome: 'Produtos', pct: 28, cor: '#6B7060' },
        { nome: 'Assinaturas', pct: 18, cor: '#B5B594' },
        { nome: 'Outros', pct: 8, cor: '#D6D8CA' },
      ],
      corEntrada: p.corEntrada ?? '#3B4332',
      corSaida: p.corSaida ?? '#B5B594',
      corHorizontal: p.corHorizontal ?? '#3B4332',
      raio: p.raio ?? 6,
      espaco: p.espaco ?? 18,
    };
  }
}
</script>
</body>
</html>
