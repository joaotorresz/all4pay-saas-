<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barras · Quattro ERP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: Roobert; src: url("/_blob/9f45d3fc9b401434c55da31af89c636e") format("opentype"); font-weight: 100 440; font-style: normal; font-display: swap; }
@font-face { font-family: Roobert; src: url("/_blob/0dbe723517e6d3cad136f101b60123dd") format("opentype"); font-weight: 450 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Centra No2"; src: url("/_blob/517919385a831578a4774030d0be82d0") format("truetype"); font-weight: 100 900; font-style: normal; font-display: swap; }
body{margin:0}
*{box-sizing:border-box}
.b-item{transition:background-color .15s ease, opacity .15s ease;cursor:pointer}
.b-item:hover{background-color:var(--hover) !important}
.b-col{transition:background-color .15s ease}
</style>
</helmet>
<div style="width: 1280px; height: 760px; background: #ffffff; padding: 48px; font-family: Roobert, -apple-system, sans-serif; color: #3B4332; display: flex; flex-direction: column; gap: 24px; --hover: {{corHover}}">
  <h1 style="margin: 0; font-family: 'Centra No2', Roobert, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; letter-spacing: 0">Barras</h1>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; flex: 1">
    <div style="background: #f6f6f6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Entradas × saídas por mês</h2>
        <div style="display: flex; gap: 14px; font-size: 12px; color: #6B7060">
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{corEntrada}}"></span>Entradas</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{corSaida}}"></span>Saídas</span>
        </div>
      </div>
      <div style="position: relative; display: flex; align-items: flex-end; gap: {{espaco}}px; height: {{altura}}px; border-bottom: 1px solid #e2e2e2; padding: 0 4px; background-image: {{grade}}">
        <sc-for list="{{agrupadas}}" as="b" hint-placeholder-count="6">
          <div class="b-col" style="position: relative; flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: {{espacoPar}}px; height: 100%; padding-top: 44px; border-radius: 10px 10px 0 0; background: {{b.fundo}}">
            <sc-if value="{{b.sel}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: #ffffff; border-radius: 10px; padding: 6px 10px; font-size: 12px; white-space: nowrap; display: flex; flex-direction: column; gap: 2px">
                <span style="color: #6B7060">{{b.mes}}</span>
                <span style="font-weight: 500; color: #000000; font-variant-numeric: tabular-nums">{{b.dica}}</span>
              </div>
            </sc-if>
            <div class="b-item" title="Entradas" style="width: {{larguraBarra}}%; height: {{b.he}}%; background-color: {{corEntrada}}; border-radius: {{raio}}px {{raio}}px 0 0; opacity: {{b.opacidade}}"></div>
            <div class="b-item" title="Saídas" style="width: {{larguraBarra}}%; height: {{b.hs}}%; background-color: {{corSaida}}; border-radius: {{raio}}px {{raio}}px 0 0; opacity: {{b.opacidade}}"></div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: {{espaco}}px; padding: 0 4px; font-size: 11px; color: #6B7060">
        <sc-for list="{{agrupadas}}" as="b" hint-placeholder-count="6"><span style="flex: 1; text-align: center; font-weight: {{b.pesoMes}}; color: {{b.corMes}}">{{b.mes}}</span></sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px">
      <div style="background: #f6f6f6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: {{espacoHorizontal}}px; flex: 1">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Gastos por categoria</h2>
        <sc-for list="{{horizontais}}" as="h" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; font-size: 13px">
              <span>{{h.nome}}</span>
              <span style="font-weight: 500; color: #000000; font-variant-numeric: tabular-nums">{{h.valor}}</span>
            </div>
            <div style="height: {{espessuraHorizontal}}px; background: #ffffff; border-radius: 999px; overflow: hidden">
              <div class="b-item" style="height: 100%; width: {{h.pct}}%; background-color: {{h.cor}}; border-radius: 999px"></div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="background: #f6f6f6; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Composição (empilhada)</h2>
        <div style="display: flex; gap: {{separacaoPilha}}px; height: {{alturaPilha}}px; border-radius: {{raio}}px; overflow: hidden">
          <sc-for list="{{pilha}}" as="s" hint-placeholder-count="4"><div class="b-item" style="width: {{s.pct}}%; background-color: {{s.cor}}"></div></sc-for>
        </div>
        <div style="display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #6B7060">
          <sc-for list="{{pilha}}" as="s" hint-placeholder-count="4">
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{s.cor}}"></span>{{s.nome}} · {{s.pct}}%</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;corEntrada&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B4332&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;corSaida&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B5B594&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;corHorizontal&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B4332&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;corHover&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6B7060&quot;,&quot;section&quot;:&quot;Interação&quot;},&quot;corSelecao&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ECFD52&quot;,&quot;section&quot;:&quot;Interação&quot;},&quot;opacidadeSelecao&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.05,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Interação&quot;},&quot;mesSelecionado&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;default&quot;:&quot;Ago&quot;,&quot;options&quot;:[&quot;Nenhum&quot;,&quot;Mai&quot;,&quot;Jun&quot;,&quot;Jul&quot;,&quot;Ago&quot;,&quot;Set&quot;,&quot;Out&quot;],&quot;section&quot;:&quot;Interação&quot;},&quot;opacidadeOutros&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Interação&quot;},&quot;altura&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:390,&quot;min&quot;:200,&quot;max&quot;:480,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Tamanho&quot;},&quot;larguraBarra&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:48,&quot;min&quot;:10,&quot;max&quot;:48,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Tamanho&quot;},&quot;espacoPar&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:16,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Espaçamento&quot;},&quot;espaco&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:4,&quot;max&quot;:40,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Espaçamento&quot;},&quot;raio&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:11,&quot;min&quot;:0,&quot;max&quot;:16,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;grade&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Grade&quot;},&quot;espessuraHorizontal&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:13,&quot;min&quot;:4,&quot;max&quot;:28,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Barras horizontais&quot;},&quot;espacoHorizontal&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:16,&quot;min&quot;:4,&quot;max&quot;:28,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Barras horizontais&quot;},&quot;alturaPilha&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:34,&quot;min&quot;:8,&quot;max&quot;:56,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Empilhada&quot;},&quot;separacaoPilha&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:8,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Empilhada&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dados = [['Mai', 82, 64], ['Jun', 90, 70], ['Jul', 76, 81], ['Ago', 98, 72], ['Set', 104, 88], ['Out', 112, 79]];
    const max = 120;
    const sel = p.mesSelecionado ?? 'Ago';
    const corSel = p.corSelecao ?? '#ECFD52';
    const opSel = p.opacidadeSelecao ?? 0.35;
    const fundoSel = 'color-mix(in srgb, ' + corSel + ' ' + Math.round(opSel * 100) + '%, transparent)';
    const outros = p.opacidadeOutros ?? 1;
    const fmt = (v) => 'R$' + v.toLocaleString('pt-BR');
    const cats = [['Folha', 42000], ['Fornecedores', 31500], ['Impostos', 18200], ['Aluguel', 9800], ['Marketing', 6400]];
    const top = cats[0][1];
    const linhaGrade = 'repeating-linear-gradient(to bottom, transparent 0, transparent calc(25% - 1px), #e2e2e2 calc(25% - 1px), #e2e2e2 25%)';
    return {
      agrupadas: dados.map(([mes, e, s]) => {
        const ativo = mes === sel;
        return {
          mes, he: Math.round((e / max) * 100), hs: Math.round((s / max) * 100),
          sel: ativo, fundo: ativo ? fundoSel : 'transparent',
          opacidade: sel === 'Nenhum' || ativo ? 1 : outros,
          dica: '+' + fmt(e * 1000) + ' · −' + fmt(s * 1000),
          pesoMes: ativo ? 500 : 400, corMes: ativo ? '#3B4332' : '#6B7060',
        };
      }),
      horizontais: cats.map(([nome, v]) => ({ nome, valor: fmt(v), pct: Math.round((v / top) * 100), cor: p.corHorizontal ?? '#3B4332' })),
      pilha: [
        { nome: 'Serviços', pct: 46, cor: '#3B4332' },
        { nome: 'Produtos', pct: 28, cor: '#6B7060' },
        { nome: 'Assinaturas', pct: 18, cor: '#B5B594' },
        { nome: 'Outros', pct: 8, cor: '#D6D8CA' },
      ],
      corEntrada: p.corEntrada ?? '#3B4332',
      corSaida: p.corSaida ?? '#B5B594',
      corHover: p.corHover ?? '#6B7060',
      altura: p.altura ?? 380,
      larguraBarra: p.larguraBarra ?? 36,
      espacoPar: p.espacoPar ?? 4,
      espaco: p.espaco ?? 18,
      raio: p.raio ?? 6,
      grade: (p.grade ?? true) ? linhaGrade : 'none',
      espessuraHorizontal: p.espessuraHorizontal ?? 10,
      espacoHorizontal: p.espacoHorizontal ?? 14,
      alturaPilha: p.alturaPilha ?? 28,
      separacaoPilha: p.separacaoPilha ?? 0,
    };
  }
}
</script>
</body>
</html>
