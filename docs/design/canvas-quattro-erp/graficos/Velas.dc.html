<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Velas · Quattro ERP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: Roobert; src: url("/_blob/9f45d3fc9b401434c55da31af89c636e") format("opentype"); font-weight: 100 440; font-style: normal; font-display: swap; }
@font-face { font-family: Roobert; src: url("/_blob/0dbe723517e6d3cad136f101b60123dd") format("opentype"); font-weight: 450 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Centra No2"; src: url("/_blob/517919385a831578a4774030d0be82d0") format("truetype"); font-weight: 100 900; font-style: normal; font-display: swap; }
body{margin:0}
*{box-sizing:border-box}
.v-item{cursor:pointer}
.v-item .v-corpo,.v-item .v-pavio{transition:fill .15s ease, stroke .15s ease}
.v-item:hover .v-corpo{fill:var(--hover)}
.v-item:hover .v-pavio{stroke:var(--hover)}
.v-item:hover .v-fundo{fill:var(--hover);fill-opacity:.08}
</style>
</helmet>
<div style="width: 1280px; height: 680px; background: #ffffff; padding: 48px; font-family: Roobert, -apple-system, sans-serif; color: #3B4332; display: flex; flex-direction: column; gap: 24px; --hover: {{corHover}}">
  <h1 style="margin: 0; font-family: 'Centra No2', Roobert, sans-serif; font-weight: 500; font-size: 30px; text-transform: uppercase; letter-spacing: 0">Velas</h1>

  <div style="background: #f6f6f6; border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; flex: 1">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500">Saldo por semana</h2>
        
      </div>
      <div style="display: flex; gap: 16px; font-size: 12px; color: #6B7060">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 14px; border-radius: 2px; background: {{corAlta}}"></span>Fechou acima</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 14px; border-radius: 2px; background: {{corBaixa}}"></span>Fechou abaixo</span>
      </div>
    </div>
    <div style="position: relative">
      <svg width="100%" height="{{altura}}" viewBox="0 0 1120 {{altura}}" preserveAspectRatio="none" role="img" aria-label="Saldo semanal em velas, doze semanas, com tendência de alta">
        <sc-if value="{{mostrarGrade}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{grade}}" as="g" hint-placeholder-count="4">
            <line x1="0" y1="{{g.y}}" x2="1120" y2="{{g.y}}" stroke="{{corGrade}}" stroke-dasharray="{{tracoGrade}}"></line>
          </sc-for>
        </sc-if>
        <sc-for list="{{velas}}" as="v" hint-placeholder-count="12">
          <g class="v-item">
            <rect class="v-fundo" x="{{v.colX}}" y="0" width="{{v.colW}}" height="{{altura}}" rx="10" fill="{{v.fundo}}" fill-opacity="{{v.fundoOp}}"></rect>
            <line class="v-pavio" x1="{{v.cx}}" y1="{{v.yMax}}" x2="{{v.cx}}" y2="{{v.yMin}}" stroke="{{v.cor}}" stroke-width="{{pavio}}" stroke-linecap="round" opacity="{{v.opacidade}}"></line>
            <rect class="v-corpo" x="{{v.x}}" y="{{v.y}}" width="{{v.w}}" height="{{v.h}}" rx="{{raio}}" fill="{{v.cor}}" opacity="{{v.opacidade}}"></rect>
          </g>
        </sc-for>
      </svg>
      <sc-if value="{{temDica}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; top: 4px; left: {{dica.left}}%; transform: translateX(-50%); background: #ffffff; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; white-space: nowrap; pointer-events: none">
          <span style="color: #6B7060">{{dica.rotulo}}</span>
          <span style="color: #3B4332">Abertura <span style="font-weight: 500; color: #000000; font-variant-numeric: tabular-nums">{{dica.ab}}</span> · Fechamento <span style="font-weight: 500; color: #000000; font-variant-numeric: tabular-nums">{{dica.fe}}</span></span>
          <span style="color: #6B7060">Mín. {{dica.mi}} · Máx. {{dica.ma}}</span>
        </div>
      </sc-if>
    </div>
    <div style="display: flex; justify-content: space-around; font-size: 11px; color: #6B7060">
      <sc-for list="{{velas}}" as="v" hint-placeholder-count="12"><span style="font-weight: {{v.pesoRotulo}}; color: {{v.corRotulo}}">{{v.rotulo}}</span></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;corAlta&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B4332&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;corBaixa&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B5B594&quot;,&quot;section&quot;:&quot;Cores&quot;},&quot;corHover&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6B7060&quot;,&quot;section&quot;:&quot;Interação&quot;},&quot;corSelecao&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ECFD52&quot;,&quot;section&quot;:&quot;Interação&quot;},&quot;opacidadeSelecao&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Interação&quot;},&quot;semanaSelecionada&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;default&quot;:&quot;S9&quot;,&quot;options&quot;:[&quot;Nenhuma&quot;,&quot;S1&quot;,&quot;S2&quot;,&quot;S3&quot;,&quot;S4&quot;,&quot;S5&quot;,&quot;S6&quot;,&quot;S7&quot;,&quot;S8&quot;,&quot;S9&quot;,&quot;S10&quot;,&quot;S11&quot;,&quot;S12&quot;],&quot;section&quot;:&quot;Interação&quot;},&quot;opacidadeOutros&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Interação&quot;},&quot;altura&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:380,&quot;min&quot;:220,&quot;max&quot;:420,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Tamanho&quot;},&quot;espaco&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:8,&quot;min&quot;:4,&quot;max&quot;:80,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Espaçamento&quot;},&quot;raio&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;pavio&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:0.5,&quot;max&quot;:6,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;mostrarGrade&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Grade&quot;},&quot;corGrade&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e2e2e2&quot;,&quot;section&quot;:&quot;Grade&quot;},&quot;gradeTracejada&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Grade&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:680}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const d = [[100,112,96,118],[112,108,102,120],[108,124,104,128],[124,130,118,136],[130,122,116,134],[122,138,120,142],[138,146,132,150],[146,140,134,152],[140,156,138,160],[156,168,150,172],[168,162,154,174],[162,178,158,182]];
    const W = 1120, altura = p.altura ?? 380, topo = 20, base = altura - 20, min = 90, max = 190;
    const y = (v) => base - ((v - min) / (max - min)) * (base - topo);
    const n = d.length;
    const passo = W / n;
    const espaco = p.espaco ?? 46;
    const larg = Math.max(2, passo - espaco);
    const alta = p.corAlta ?? '#3B4332', baixa = p.corBaixa ?? '#B5B594';
    const sel = p.semanaSelecionada ?? 'S9';
    const outros = p.opacidadeOutros ?? 1;
    const k = (v) => 'R$' + v + ' mil';
    let dica = { left: 50, rotulo: '', ab: '', fe: '', mi: '', ma: '' };
    const velas = d.map(([ab, fe, mi, ma], i) => {
      const cx = passo * i + passo / 2;
      const y1 = y(Math.max(ab, fe)), y2 = y(Math.min(ab, fe));
      const rotulo = 'S' + (i + 1);
      const ativo = rotulo === sel;
      if (ativo) dica = { left: (cx / W) * 100, rotulo: 'Semana ' + (i + 1), ab: k(ab), fe: k(fe), mi: k(mi), ma: k(ma) };
      return {
        cx: cx.toFixed(1), x: (cx - larg / 2).toFixed(1), w: larg.toFixed(1), y: y1.toFixed(1), h: Math.max(2, y2 - y1).toFixed(1),
        yMax: y(ma).toFixed(1), yMin: y(mi).toFixed(1), cor: fe >= ab ? alta : baixa, rotulo,
        colX: (passo * i + 2).toFixed(1), colW: (passo - 4).toFixed(1),
        fundo: ativo ? (p.corSelecao ?? '#ECFD52') : 'transparent', fundoOp: ativo ? (p.opacidadeSelecao ?? 0.35) : 0,
        opacidade: sel === 'Nenhuma' || ativo ? 1 : outros,
        pesoRotulo: ativo ? 500 : 400, corRotulo: ativo ? '#3B4332' : '#6B7060',
      };
    });
    return {
      velas, dica, temDica: sel !== 'Nenhuma',
      grade: [0.25, 0.5, 0.75, 1].map((f) => ({ y: (topo + (base - topo) * f).toFixed(1) })),
      altura, corAlta: alta, corBaixa: baixa, raio: p.raio ?? 3, pavio: p.pavio ?? 1.5,
      corHover: p.corHover ?? '#6B7060',
      mostrarGrade: p.mostrarGrade ?? true, corGrade: p.corGrade ?? '#e2e2e2',
      tracoGrade: (p.gradeTracejada ?? true) ? '3 4' : '0',
    };
  }
}
</script>
</body>
</html>
