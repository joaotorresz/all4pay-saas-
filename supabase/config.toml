# Configuração das Edge Functions do all4pay.
# project_id é só um rótulo local; o deploy usa --project-ref.
project_id = "all4pay-saas"

# Open Finance (Pluggy).
# pluggy-connect-token: verify_jwt=false no gateway para o preflight OPTIONS
# (sem header Authorization) NÃO ser barrado e o CORS completar. A auth NÃO
# regride — o JWT é validado dentro do handler (getUser → 401 sem usuário).
[functions.pluggy-connect-token]
verify_jwt = false

# pluggy-webhook: o Pluggy não manda JWT Supabase — auth por segredo na query.
[functions.pluggy-webhook]
verify_jwt = false

# pluggy-sync-item: caminho ATIVO (onSuccess do widget). verify_jwt=false p/ o
# OPTIONS passar; auth validada no handler (getUser → 401) + posse do item.
[functions.pluggy-sync-item]
verify_jwt = false

# Segundo fator por app autenticador (TOTP). Em produção o Supabase já o liga
# por padrão; aqui ele vem DESLIGADO quando a seção não existe, e a prova local
# do cadastro e do código no login (`npm run segundo-fator`) não teria o que medir.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
