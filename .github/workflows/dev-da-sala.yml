name: Dev da Sala

# Pega UMA tarefa aprovada na Sala da Quattro (espelhada no ClickUp num card cujo nome começa com "▶ SALA · ERP ·"),
# o Claude implementa e commita numa branch; o próprio workflow envia a branch, abre o PR e devolve o resultado no card. Nunca faz merge.
on:
  schedule:
    - cron: "40 12-21 * * 1-5"   # de hora em hora, 9h–18h de Brasília, dias úteis
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-da-sala
  cancel-in-progress: false

env:
  SALA_PREFIX: "▶ SALA · ERP ·"
  CLICKUP_LIST: "901716820588"

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Próxima tarefa aprovada
        id: pick
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: $CLICKUP_TOKEN" \
            "https://api.clickup.com/api/v2/list/$CLICKUP_LIST/task?statuses%5B%5D=to%20do&include_markdown_description=true&subtasks=true" \
            > "$RUNNER_TEMP/tasks.json"
          python3 - <<'PY'
          import json, os
          ts = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "tasks.json"))).get("tasks", [])
          ts = [t for t in ts if t.get("name", "").startswith(os.environ["SALA_PREFIX"])]
          rank = {"urgent": 1, "high": 2, "normal": 3, "low": 4}
          ts.sort(key=lambda t: (rank.get((t.get("priority") or {}).get("priority"), 5), int(t.get("due_date") or 9e15)))
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if not ts:
              out.write("has=false\n")
              raise SystemExit(0)
          t = ts[0]
          out.write("has=true\nid=%s\n" % t["id"])
          titulo = t["name"][len(os.environ["SALA_PREFIX"]):].strip() or t["name"]
          open(os.path.join(os.environ["RUNNER_TEMP"], "titulo.txt"), "w").write(titulo[:120])
          body = t.get("markdown_description") or t.get("text_content") or ""
          open(os.path.join(os.environ["RUNNER_TEMP"], "tarefa.md"), "w").write("# " + t["name"] + "\n\n" + body + "\n")
          PY

      - name: Marca como em andamento
        if: steps.pick.outputs.has == 'true'
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          TASK: ${{ steps.pick.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"em andamento claude"}' "https://api.clickup.com/api/v2/task/$TASK" > /dev/null
          jq -n --arg t "COMEÇOU: $RUN_URL" '{comment_text:$t, notify_all:false}' | \
            curl -fsS -X POST -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" -d @- \
            "https://api.clickup.com/api/v2/task/$TASK/comment" > /dev/null
          git rev-parse origin/main > "$RUNNER_TEMP/main_antes.txt"
          git config user.name "Dev da Sala"
          git config user.email "dev-da-sala@users.noreply.github.com"
          git checkout -b "sala-$TASK"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.has == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        if: steps.pick.outputs.has == 'true'
        run: npm ci

      - name: Dev da Sala (Claude Code)
        if: steps.pick.outputs.has == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Você é o erp-gestor e o erp-dev deste repositório. Antes de tudo, leia CLAUDE.md e os contratos em .claude/agents/erp-gestor.md, .claude/agents/erp-dev.md e .claude/agents/guarda.md. As travas deles valem acima desta instrução.

            A tarefa aprovada pelo João está em ${{ runner.temp }}/tarefa.md. Leia inteira.

            1. Se faltar dado essencial, se a tarefa pedir algo que uma trava proíbe, ou se ela exigir credencial, variável de ambiente, migration aplicada ou acesso ao banco: NÃO programe. Escreva em ${{ runner.temp }}/resultado.md uma linha começando com "BLOQUEIO:" e o motivo em até 5 linhas, e pare.
            2. Você já está na branch sala-${{ steps.pick.outputs.id }}, criada pelo workflow. Não troque de branch, não crie outra e não use worktree.
            3. Implemente SÓ o escopo da tarefa. Achou outro problema? Anote no resultado, não conserte.
            4. Rode e guarde a saída: npm run typecheck, npm run build e npm test. Se npm test falhar só no esquema (manifesto velho) ou no ddl:prova (prazo vencido de own_extrato_lojista), registre isso como falha pré-existente e siga; qualquer outra falha precisa ser resolvida ou vira BLOQUEIO. Esta execução não tem acesso ao banco: diga isso em vez de estimar números.
            5. git add e git commit (mensagem em português). NÃO faça push e NÃO abra PR: o workflow faz isso depois, com o seu resultado.md como corpo do PR.
            6. Nunca dê merge, nunca mexa em main, nunca crie ou altere segredo, variável de ambiente ou configuração.
            7. Escreva em ${{ runner.temp }}/resultado.md o corpo do PR, nesta ordem: primeira linha "FEITO: <resumo de uma linha>"; depois O QUE MUDOU (3 linhas), VERIFICAÇÃO (saída resumida dos comandos), CONFIGURAR (João) ou "nada", RISCO EM PRODUÇÃO, ACHADOS FORA DO ESCOPO. Última linha: "Tarefa da Sala: ${{ steps.pick.outputs.id }}".
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(npm run typecheck:*),Bash(npm run build:*),Bash(npm run lint:*),Bash(npm test:*),Bash(npx tsc:*),Bash(npx vitest:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(node --version),Bash(mkdir:*)"

      - name: Abre o PR
        id: pr
        if: always() && steps.pick.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.pick.outputs.id }}
        run: |
          set -uo pipefail
          B="sala-$TASK"
          R="$RUNNER_TEMP/resultado.md"
          if head -n 1 "$R" 2>/dev/null | grep -q '^BLOQUEIO'; then echo "Bloqueado pelo dev; sem PR."; exit 0; fi
          if ! head -n 1 "$R" 2>/dev/null | grep -q '^FEITO'; then echo "Sem resultado FEITO; sem PR."; exit 0; fi
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "$B" ]; then git checkout "$B" || exit 0; fi
          if [ -n "$(git status --porcelain)" ]; then git add -A && git commit -q -m "Dev da Sala: alterações não commitadas ($TASK)"; fi
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "Nada mudou; sem PR."; exit 0; fi
          if git diff --name-only origin/main..HEAD | grep -q '^\.github/workflows/'; then
            printf 'BLOQUEIO: a mudança mexe em .github/workflows, o que o Dev da Sala não pode publicar. Branch local descartada.\n' > "$R"; exit 0
          fi
          git push -u origin "$B" || { printf 'BLOQUEIO: o push da branch %s falhou. Veja o log.\n' "$B" > "$R"; exit 0; }
          URL="$(gh pr create --base main --head "$B" --title "$(cat "$RUNNER_TEMP/titulo.txt")" --body-file "$R")" || { printf 'BLOQUEIO: branch %s enviada, mas o PR não abriu. Abra manualmente.\n' "$B" > "$R"; exit 0; }
          { echo "FEITO: $URL"; tail -n +2 "$R" | head -c 2500; } > "$R.card" && mv "$R.card" "$R"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Devolve o resultado ao card
        if: always() && steps.pick.outputs.has == 'true'
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          TASK: ${{ steps.pick.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/resultado.md"
          if [ -s "$R" ]; then TXT="$(head -c 3000 "$R")"; else TXT="BLOQUEIO: a execução terminou sem resultado. Veja o log: $RUN_URL"; fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(cat "$RUNNER_TEMP/main_antes.txt")" ]; then
            TXT="$TXT
          ALERTA: a main mudou durante a execução. Confira se algo foi para main sem PR."
          fi
          jq -n --arg t "$TXT" '{comment_text:$t, notify_all:false}' | \
            curl -fsS -X POST -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" -d @- \
            "https://api.clickup.com/api/v2/task/$TASK/comment" > /dev/null
          curl -fsS -X PUT -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"in progress"}' "https://api.clickup.com/api/v2/task/$TASK" > /dev/null
