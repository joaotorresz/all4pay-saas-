name: CI

# Roda a suíte de verificação (typecheck + guardas + build) em cada PR e em cada
# push aos branches de integração.
# As guardas usam --experimental-strip-types, que exige Node >= 22.6.
#
# ⚠️ `npm test` inclui a MATRIZ DE CONSISTÊNCIA CRUZADA (`npm run consistencia`),
# que confronta cada indicador entre os caminhos que o produzem — Home, DRE,
# razão, painéis, motores. É ela que impede a volta do "mesmo número, telas
# diferentes"; sem ela rodando a cada deploy, os defeitos reaparecem sozinhos.
#
# ⚠️ E inclui o TESTE DE COERÊNCIA (`npm run coerencia`), que pergunta outra
# coisa: se a tela pode exibir uma COMBINAÇÃO de números que não pode ser
# verdade ao mesmo tempo — saldo que não bate com os lançamentos, resultado
# zero com lançamentos no período, runway finito com burn zero, ruptura sem
# projeção negativa, DRE que não fecha com o balancete. Nenhuma dessas é erro
# de fórmula, e é por isso que as outras guardas não as pegavam: cada número,
# sozinho, passa em tudo.

# ⚠️ `push` fica restrito aos branches de INTEGRAÇÃO. Com `["**"]`, todo push
# num branch com PR aberto disparava DOIS runs idênticos — o `push` e o
# `pull_request` — competindo pelos mesmos minutos para responder a mesma
# pergunta. Branch de trabalho é coberto pelo `pull_request`, que dispara a cada
# push no head. O custo declarado: um branch SEM PR aberto não roda a suíte no
# push; ele passa a rodar no instante em que o PR abre, e branch sem PR não vai
# a lugar nenhum.
on:
  # ⚠️ A4P-075: a guarda de "no ar" precisa rodar QUANDO NINGUÉM ESTÁ OLHANDO.
  # A regressão que a motivou apareceu DEPOIS do merge — um build atrasado
  # pousou por cima de um mais novo — e o pipeline já tinha terminado verde.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main, claude/epic-fermi-i423xk]
  pull_request:

# O grupo existe para o caso SUPERADO: dois pushes seguidos no mesmo branch, e a
# execução do commit velho perde a graça no instante em que o novo chega.
#
# ⚠️ Ele NÃO serve para matar o run duplicado — quem resolve isso é o gatilho
# acima. Cancelar deixa no PR uma verificação com conclusão `cancelled`, e o
# GitHub conta isso como não-sucesso: medido no commit 13c7203, o `verify`
# sobrevivente passou, o Vercel passou, e o PR ficou em `unstable` por causa do
# cancelado. Trocar um run desperdiçado por um X vermelho permanente é pior que
# o problema — um PR que parece quebrado é o mesmo defeito que o teto de tempo
# veio corrigir.
#
# A chave tem de render igual nos dois eventos: `head.ref` (no PR) e `ref_name`
# (no push) dão os dois o nome do branch. `pull_request.number || github.ref`
# NÃO servia — rendia `43` num evento e `refs/heads/<branch>` no outro.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # ⚠️ O padrão do GitHub é SEIS HORAS. Em 05/08 duas execuções ficaram presas
    # no passo de build — o mesmo commit compilou aqui em ~2 minutos e o deploy
    # de pré-visualização subiu normalmente, então era o runner, não o código.
    # Sem teto, um travamento desses deixa o PR com verificação pendente por um
    # turno inteiro de trabalho, e "pendente" é indistinguível de "ainda não
    # rodou" para quem chega depois. O teto é 6x a duração medida (~2 min).
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        # ⚠️ O `playwright` entrou como devDependency para que `npm run mobile` e
        # `npm run fluxos` rodem num checkout limpo — sem ele, os dois comandos
        # que o portão de lançamento cita só funcionavam na máquina de quem
        # tinha o pacote instalado à mão. Mas o postinstall dele baixa ~130 MB
        # de navegadores, e a CI não roda nenhum dos dois (os dois exigem o app
        # SERVIDO, o que este job não faz). Baixar navegador que ninguém abre é
        # minuto de CI gasto em nada, e uma chamada de rede a mais para falhar.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Test (typecheck + guardas + matriz de consistência)
        run: npm test
      - name: Build
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════════════
  # ISOLAMENTO — duas empresas, dois usuários, num banco de verdade
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # ⚠️ Job SEPARADO do `verify`, e de propósito. Ele sobe um Supabase local
  # (Docker) e leva minutos; pendurá-lo no `verify` faria a suíte que se roda a
  # cada commit passar a custar o dobro, e guarda cara é guarda que alguém
  # desliga. Aqui os dois correm em paralelo e o PR só fica verde com os dois.
  #
  # ⚠️ Por que um banco de verdade, e não uma simulação: as outras guardas desta
  # onda são puras e conferem o que o auditor RESPONDE. Esta confere o que o
  # banco FAZ — e é a única que pegaria uma política que existe, parece certa
  # no inventário e não filtra. A diferença entre as duas é a diferença entre
  # "a política parece certa" e "o banco me deixou".
  #
  # ⚠️ `supabase start` aplica as migrations do repositório do zero, então esta
  # guarda também prova que a sequência inteira roda num banco limpo — o que a
  # `esquema` só consegue afirmar a partir de um retrato.
  isolamento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ⚠️ O TOKEN é o conserto, e a causa era essa: a ação resolve a release
      # pela API do GitHub, e sem token a chamada é anônima — 60 requisições por
      # HORA compartilhadas por IP com todos os runners hospedados. A guarda
      # reprovou por "rate limit exceeded" sem nada de errado no código, e uma
      # guarda que reprova por infraestrutura treina quem a lê a ignorar a
      # reprovação — que é o começo de ignorar as verdadeiras.
      #
      # `latest` fica de propósito: fixar versão aqui trocaria uma falha
      # ocasional de rede por uma dívida silenciosa, com a CLI congelando numa
      # versão que ninguém revisita até o dia em que ela para de subir o
      # Postgres. O `GITHUB_TOKEN` é automático em qualquer repositório.
      # ⚠️ A CLI vem do REGISTRO NPM, não da action `supabase/setup-cli`.
      #
      # A action é baixada de `codeload.github.com` pelo runner ANTES de o passo
      # rodar — ou seja, antes de qualquer `env` que possamos passar. O
      # `GITHUB_TOKEN` que estava aqui autenticava as chamadas de API que a
      # action faz por dentro (resolver a release), e não o download dela
      # própria. Em 17/08 isso reprovou o job três vezes seguidas com
      # `429 Too Many Requests`, sem nada de errado no código — e guarda que
      # reprova por infraestrutura treina quem a lê a ignorar a reprovação.
      #
      # O registro npm não compartilha esse limite por IP de runner. `@latest`
      # fica pelo mesmo motivo que a action usava: fixar versão aqui trocaria
      # uma falha ocasional de rede por uma CLI congelada que ninguém revisita
      # até o dia em que ela para de subir o Postgres.
      - name: Instalar a CLI do Supabase (via npm, não via action)
        run: npm install -g supabase@latest
      # Só o banco: os demais serviços (studio, realtime, storage, edge) não
      # participam de nada aqui e cada um é uma imagem para baixar.
      - name: Subir o Postgres com as migrations aplicadas
        run: supabase start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - name: Guarda de isolamento (duas empresas, dois usuários)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run isolamento
      # ⚠️ Mesmo job, e não um terceiro: as duas guardas precisam do MESMO banco
      # construído do zero, e subir o stack de novo custaria os mesmos minutos
      # para responder a uma pergunta que já tem o banco na frente.
      - name: Guarda da trilha (nenhuma tabela de negócio sem auditoria)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/trilha-completa.sql
      # ⚠️ Terceira guarda no MESMO job, e pela mesma razão: as três precisam do
      # banco construído do zero pelas migrations. Um gatilho aplicado à mão no
      # remoto some no primeiro `db reset` e ninguém descobre até a primeira
      # despesa entrar dentro de uma receita.
      # ⚠️ Quarta guarda no MESMO job, pela mesma razão das três acima: ela
      # precisa do banco construído do zero pelas migrations. E precisa existir
      # porque "a matriz mora no servidor e a interface pergunta" só funciona se
      # as duas disserem a mesma coisa — o `contador_externo` ficou um mês no
      # banco sem o cliente saber nomeá-lo.
      - name: Guarda da matriz de permissão (banco × cliente)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/matriz-permissao.sql
      - name: Guarda de taxonomia (árvore do plano, código único, origem do título)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run taxonomia

  # ═══════════════════════════════════════════════════════════════════════════
  # A4P-075 — "NO AR" É ESTADO CONTÍNUO, NÃO EVENTO
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Em 17/08 o deploy atrasado do PR #103 pousou DEPOIS do #104 e o
  # sobrescreveu: `/api/versao` voltou de 4132318 para 998d800 e o conserto do
  # A4P-073 saiu do ar sozinho. Uma leitura única de `/api/versao` prova o
  # MOMENTO; ela não prova o ESTADO.
  #
  # ⚠️ Só roda no `main` e no schedule: num PR, produção legitimamente não tem o
  # commit do PR, e reprovar ali ensinaria a ignorar a reprovação.
  no-ar:
    # ⚠️ Condição ANCORADA NO EVENTO, não só no ref.
    #
    # A versão anterior olhava só `github.ref`, e o job reprovou dentro do PR
    # #105 — onde produção legitimamente NÃO tem o commit do galho. Guarda que
    # reprova por contexto treina quem a lê a ignorar a reprovação, que é o
    # começo de ignorar as verdadeiras.
    #
    # ⚠️ E há um segundo motivo, mais sério: quando produção ESTÁ errada, a
    # correção vem num PR — e exigir esta guarda verde para mergear travaria
    # exatamente o merge que a conserta. Uma guarda de estado contínuo não pode
    # bloquear o conserto do estado. Ela vigia `main` e o relógio; o PR é
    # julgado pelas outras.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ `merge-base --is-ancestor` precisa do histórico: com o checkout
          # raso o diagnóstico "build antigo × commit desconhecido" não sai.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Produção serve o HEAD de main?
        run: node scripts/no-ar.mjs --tolerancia 12
