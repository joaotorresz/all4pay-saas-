name: CI

# Roda a suíte de verificação (typecheck + guardas + build) em cada push e PR.
# As guardas usam --experimental-strip-types, que exige Node >= 22.6.
#
# ⚠️ `npm test` inclui a MATRIZ DE CONSISTÊNCIA CRUZADA (`npm run consistencia`),
# que confronta cada indicador entre os caminhos que o produzem — Home, DRE,
# razão, painéis, motores. É ela que impede a volta do "mesmo número, telas
# diferentes"; sem ela rodando a cada deploy, os defeitos reaparecem sozinhos.
on:
  push:
    branches: ["**"]
  pull_request:

# ⚠️ TODO push num branch com PR aberto dispara DOIS runs idênticos (o evento
# `push` e o `pull_request`), e os dois competem pelos mesmos minutos para
# responder a mesma pergunta. O grupo tem de render a MESMA CHAVE nos dois
# eventos, senão não agrupa nada.
#
# A primeira versão desta linha usava `pull_request.number || github.ref`, e ela
# NÃO funcionava: no `push` a chave saía `refs/heads/<branch>` e no
# `pull_request` saía `43` — duas chaves distintas, dois grupos, os dois runs
# de pé. Medido no commit 5086210: as duas execuções rodaram inteiras, lado a
# lado. `head.ref` (no PR) e `ref_name` (no push) dão os dois o nome do branch,
# que é a identidade certa: um run por branch, e um push novo cancela o
# anterior, que já não interessa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # ⚠️ O padrão do GitHub é SEIS HORAS. Em 05/08 duas execuções ficaram presas
    # no passo de build — o mesmo commit compilou aqui em ~2 minutos e o deploy
    # de pré-visualização subiu normalmente, então era o runner, não o código.
    # Sem teto, um travamento desses deixa o PR com verificação pendente por um
    # turno inteiro de trabalho, e "pendente" é indistinguível de "ainda não
    # rodou" para quem chega depois. O teto é 6x a duração medida (~2 min).
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Test (typecheck + guardas + matriz de consistência)
        run: npm test
      - name: Build
        run: npm run build
