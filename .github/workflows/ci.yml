name: CI

# Roda a suíte de verificação (typecheck + guardas da IA + build) em cada push
# e PR. As guardas (smoke/corpus/values/edge) usam --experimental-strip-types,
# que exige Node >= 22.6.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Test (typecheck + smoke + corpus + values + edge)
        run: npm test
      - name: Build
        run: npm run build
