name: CI

# Roda a suíte de verificação (typecheck + guardas + build) em cada push e PR.
# As guardas usam --experimental-strip-types, que exige Node >= 22.6.
#
# ⚠️ `npm test` inclui a MATRIZ DE CONSISTÊNCIA CRUZADA (`npm run consistencia`),
# que confronta cada indicador entre os caminhos que o produzem — Home, DRE,
# razão, painéis, motores. É ela que impede a volta do "mesmo número, telas
# diferentes"; sem ela rodando a cada deploy, os defeitos reaparecem sozinhos.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Test (typecheck + guardas + matriz de consistência)
        run: npm test
      - name: Build
        run: npm run build
